<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ввод товаров — project-A</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="page">
    <nav class="site-nav" aria-label="Основная навигация">
        <a href="/" class="is-active" aria-current="page">Ввод товаров</a>
        <a href="/products.html">Все товары</a>
    </nav>

    <section class="card" aria-labelledby="form-title">
        <header class="card__header">
            <h1 id="form-title">Ввод товаров</h1>
            <p class="card__hint">
                Заполните нужные строки и нажмите «Сохранить». Пустые строки пропускаются.
            </p>
        </header>

        <div class="table-wrap">
            <table class="entry-table">
                <thead>
                <tr>
                    <th scope="col">Товар</th>
                    <th scope="col" class="col-qty">Количество</th>
                </tr>
                </thead>
                <tbody id="rows"><!-- 30 строк генерируются в app.js --></tbody>
            </table>
        </div>

        <footer class="card__footer">
            <span class="status" id="status" role="status" aria-live="polite"></span>
            <button type="button" class="btn btn--primary" id="save">Сохранить</button>
        </footer>
    </section>

    <section class="card card--secondary" aria-labelledby="recent-title">
        <header class="card__header">
            <h2 id="recent-title">Последние сохранённые</h2>
        </header>
        <div class="table-wrap table-wrap--short">
            <table class="entry-table entry-table--readonly">
                <thead>
                <tr>
                    <th scope="col">Товар</th>
                    <th scope="col" class="col-qty">Количество</th>
                </tr>
                </thead>
                <tbody id="recent">
                <tr><td colspan="2" class="empty">Пока ничего не сохранено</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script src="/js/app.js" defer></script>
</body>
</html>
